services:
  postgres:
    image: postgres:16-alpine
    container_name: applyai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: applyai
    ports:
      - "5432:5432"
    volumes:
      - applyai-postgres-data:/var/lib/postgresql/data

volumes:
  applyai-postgres-data:
